pid /data/data/com.termux/files/home/nginx.pid;
worker_processes 1;
error_log /data/data/com.termux/files/home/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /data/data/com.termux/files/usr/etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 64m;

    server {
        listen 8080;
        server_name localhost;

        root /data/data/com.termux/files/home/MeWeb;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
