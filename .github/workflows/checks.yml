name: MeWeb checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check assets/js/projects.js
          node --check assets/js/main.js
      - name: Verify project/cover counts
        run: |
          node -e "const f=require('fs').readFileSync('assets/js/projects.js','utf8');const n=(f.match(/id: \"[^\"]+\"/g)||[]).length;const c=(f.match(/cover: IMG \+ /g)||[]).length;console.log('projects',n,'covers',c);if(n!==c)process.exit(1);"
      - name: Verify all cover files exist
        run: |
          node -e "
            const fs=require('fs');
            const p='assets/js/projects.js';
            const s=fs.readFileSync(p,'utf8');
            const re=/cover: IMG \+ \"([^\"]+)\"/g;
            let m; let bad=0;
            while((m=re.exec(s))){const f='assets/img/projects/'+m[1]; if(!fs.existsSync(f)){console.error('MISSING',f);bad++;}}
            if(bad)process.exit(1);
            console.log('all covers ok');
          "
